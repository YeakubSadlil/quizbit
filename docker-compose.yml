services:
  db:
    image: postgres:17.4
    container_name: postgresDB
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # populate the sample db once
      - ./sample_database/sample_db.sql:/docker-entrypoint-initdb.d/sample_db.sql
    env_file:
      - .env

  redis:
    image: redis:alpine
    container_name: redis-service
    ports:
      - "6380:6379"
    command: ["redis-server", "--maxmemory", "1000mb", "--maxmemory-policy", "allkeys-lru"]

  # redis-exporter for monitoring redis in Grafana
  redis-exporter:
    image: oliver006/redis_exporter
    container_name: redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis-service:6379
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - django_web

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/Grafana_Dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/Grafana_Dashboards/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/Grafana_Dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
    depends_on:
      - prometheus

  django_web:
    build: .
    image: quizbit-django_web:1.0.1
    container_name: django-docker
    ports:
      - "8081:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis-service
    volumes:
      - .:/app
    command: >
      sh -c "while ! nc -z db 5432; do echo '⏳ waiting for PostgreSQL...'; sleep 1; done &&
             python manage.py runserver 0.0.0.0:8080"

#    command: >
#      sh -c "while ! nc -z db 5432; do echo '⏳ waiting for PostgreSQL...'; sleep 1; done &&
#            python manage.py makemigrations --noinput &&
#            python manage.py migrate &&
#            python manage.py runserver 0.0.0.0:8080"

volumes:
  postgres_data:
  prometheus-data:
  grafana-storage: {}
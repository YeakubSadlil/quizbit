services:
  db:
    image: postgres:17.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sample_database/backup_db.sql:/docker-entrypoint-initdb.d/backup_db.sql
    env_file:
      - .env

  django_web:
    build: .
    container_name: django-docker
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DJANGO_Scrt_KEY: ${DJANGO_Scrt_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      E_PORT: ${E_PORT}
      E_HOST_USER: ${E_HOST_USER}
      E_HOST_PASSWORD: ${E_HOST_PASSWORD}
    env_file:
      - .env
    command: >
      sh -c "while ! nc -z db 5432; do echo '⏳ waiting for PostgreSQL...'; sleep 1; done &&
             python manage.py makemigrations --noinput &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"

volumes:
  postgres_data: